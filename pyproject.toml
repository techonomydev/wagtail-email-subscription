[tool.poetry]
name = "wagtail-email-subscription"
version = "0.0.0"
description = "Wagtail form integration with Email marketing platforms like Active Campaign"
authors = [
    "Martijn Jacobs <maerteijn@gmail.com>",
    "Jochem Kuipers <jochem@kuipers.cc>",
]
license = "MIT"
readme = "README.md"
repository = "https://github.com/maerteijn/wagtail-email-subscription"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
packages = [{ include = "wagtail_email_subscription", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
Django = "~5.2"
wagtail = "~7.0.1"
activecampaign-python = "^1.0.10"
wagtail-generic-chooser = "^0.7"

[tool.poetry.group.dev.dependencies]
flake8 = "~7.3.0"
flake8-black = "^0.3.6"
flake8-isort = "6.1.2"
pylint = "~3.3.7"
black = "^25.1.0"
psycopg2 = "~2.9.10"
pytest = "~8.4.1"
pytest-django = "~4.11.1"
pytest-cov = "~6.2.1"
pytest-env = "^1.1.5"
requests-mock = "^1.12.1"
wagtail-factories = "^4.2.1"
pytest-mock = "~3.14.1"

# [tool.poetry.requires-plugins]
# poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
latest-tag = true

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
exclude = "/migrations/"

[tool.pylint.messages_control]
disable = "R,C,,W0511"

[tool.pylint.format]
max-line-length = "88"

[tool.pylint.master]
init-hook = "import sys; sys.path.append('.')"
ignore = "migrations"

[tool.isort]
force_grid_wrap = 0
include_trailing_comma = true
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.pytest.ini_options]
pythonpath = "sandbox"
DJANGO_SETTINGS_MODULE = "settings"
testpaths = "tests/"
addopts = "--create-db --no-migrations"

[tool.coverage.run]
omit = ["**/migrations/**", "**/tests/**", "sandbox/**"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["raise NotImplementedError"]
