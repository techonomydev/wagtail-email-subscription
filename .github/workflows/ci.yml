name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: ./src

jobs:
  setup-and-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          path: ./src
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
           python-version: '3.12'
      - name: Install python dependencies
        run: |
          pip install poetry poetry-dynamic-versioning
          poetry install
      - name: Lint with flake8 and pylint
        run: |
          poetry run flake8 .
          poetry run pylint src/
      - name: Upload src dir as artefact
        uses: actions/upload-artifact@v4
        with:
          name: src
          path: ./src

  run-tests:
    needs: setup-and-linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wagtail-email-subscription
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["5.2"]
        wagtail-version: ["7.0"]
    steps:
      - name: Download src dir
        uses: actions/download-artifact@v4
        with:
          name: src
          path: ./src
      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install python dependencies
        run: |
          pip install poetry
          poetry install
      - name: Install specific matrix dependencies
        run: |
          poetry run pip install "wagtail~=${{ matrix.wagtail-version }}.0" "django~=${{ matrix.django-version }}.0"
          poetry run pip list
      - name: Run the testsuite
        env:
          DJANGO_SETTINGS_MODULE: settings.github-ci
        run: |
          poetry run pytest